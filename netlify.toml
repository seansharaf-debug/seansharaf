[build]
  publish = "."

[[headers]]
  for = "/command/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/lockin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
